<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>M2 Luxuries CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0a0a;--surface:#141414;--surface2:#1e1e1e;--surface3:#282828;
  --border:#2e2e2e;--border2:#3a3a3a;--text:#f0f0f0;--text2:#b0b0b0;--muted:#666;
  --green:#4caf50;--red:#f44336;--blue:#90caf9;--yellow:#ffd54f;--orange:#ff9800;
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
.header{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 10px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:1.5px;line-height:1;color:#CCDA46;}
.crm-tag{font-size:10px;color:var(--muted);letter-spacing:2px;font-family:'DM Sans',sans-serif;font-weight:400;margin-left:5px;vertical-align:middle;}
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:6px;vertical-align:middle;}
.sync-dot.online{background:var(--green);}
.sync-dot.offline{background:var(--red);}
.sync-dot.syncing{background:var(--yellow);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.header-btns{display:flex;gap:5px;}
.hbtn{padding:7px 10px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:'DM Sans',sans-serif;white-space:nowrap;}
.hbtn.primary{background:var(--text);color:#000;border-color:var(--text);}
.page{display:none;padding:14px 14px 120px;flex-direction:column;gap:12px;}
.page.active{display:flex;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
.section-title{font-size:9px;font-weight:700;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;margin-bottom:14px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px;position:relative;overflow:hidden;}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--border2);}
.stat-label{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:5px;}
.stat-value{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--text);line-height:1;}
.stat-sub{font-size:10px;color:var(--muted);margin-top:3px;}
.page-hdr{display:flex;align-items:flex-start;justify-content:space-between;}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;}
.page-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.search-wrap{position:relative;}
.search-bar{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px 10px 38px;font-size:14px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;}
.search-bar::placeholder{color:var(--muted);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none;}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;padding-bottom:0;}
.list-row:first-child{padding-top:0;}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--surface3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--text);flex-shrink:0;}
.row-info{flex:1;min-width:0;}
.row-name{font-size:14px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.row-value{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--text);}
.job-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.job-row:last-child{border-bottom:none;padding-bottom:0;}
.job-row:first-child{padding-top:0;}
.job-info{flex:1;min-width:0;}
.job-name{font-size:14px;font-weight:600;line-height:1.3;}
.job-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.job-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.job-price{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--text);}
.badge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap;}
.badge-complete{background:rgba(76,175,80,.15);color:var(--green);border:1px solid rgba(76,175,80,.3);}
.badge-lead{background:rgba(144,202,249,.12);color:var(--blue);border:1px solid rgba(144,202,249,.25);}
.badge-quoted{background:rgba(255,213,79,.1);color:var(--yellow);border:1px solid rgba(255,213,79,.25);}
